<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2F6B4F" />
    <meta name="description" content="Y Soft: ventas, caja, inventario y cartera para distribuidoras." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./ysoft-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>Y Soft · Operación diaria</title>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" role="status" aria-live="polite">
        <div class="boot-mark">YS</div>
        <strong>Abriendo el cuaderno</strong>
        <span>Comprobando la sesión y la operación local…</span>
      </div>
    </div>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="./styles.css?v=home4" />
    <script src="./firebase-init.js?v=home4"></script>
    <script src="./config.js?v=firestore1" defer></script>
    <script src="./data.js?v=home4" defer></script>
    <script src="./firestore-service.js?v=firestore1" defer></script>
    <script src="./components.js?v=home4" defer></script>
    <script src="./screens.js?v=home4" defer></script>
    <script src="./screens-more.js?v=home4" defer></script>
    <script src="./app.js?v=home4" defer></script>
    <script>
      (function () {
        function showBootError() {
          var root = document.getElementById('root');
          if (!root || root.querySelector('.app-shell') || root.querySelector('.auth-screen')) return;
          root.innerHTML = '<div class="boot-screen boot-error" role="alert"><div class="boot-mark">YS</div><strong>No se pudo abrir Y Soft</strong><span>Recarga la aplicación. Si el problema continúa, borra los datos del sitio y vuelve a abrirla.</span><button type="button" onclick="window.location.reload()">Recargar</button></div>';
        }
        window.addEventListener('error', showBootError);
        window.addEventListener('unhandledrejection', showBootError);
        window.setTimeout(showBootError, 8000);
      })();
    </script>
  </body>
</html>
